services:
  api:
    build:
      # context: ./api/
      # dockerfile: ../docker/Dockerfile.api
      context: ./python_api/
      dockerfile: ../docker/Dockerfile.python_api

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_PASS: "$DB_PASSWORD"
      DB_NAME: "$DB_DBNAME"
      MQ_HOST: mq
      MQ_PORT: 5672

    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy

    ports:
      - "8005:8000"

    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]

    volumes:
      - ./python_api:/app

    networks:
      - default
      - traefik

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    deploy:
      restart_policy:
        condition: on-failure
        delay: 10s

  companion:
    env_file:
      - .env.companion

    networks:
      - default
      - traefik

    volumes:
      - /tmp/companion_data:/data

  db:
    image: postgres:14.1

    environment:
      POSTGRES_USER: "$DB_USER"
      POSTGRES_PASSWORD: "$DB_PASSWORD"
      POSTGRES_DB: "$DB_DBNAME"

    ports:
      - "15432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_DBNAME"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - ./docker/data:/docker-entrypoint-initdb.d/

  mq:
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

  consul:
    volumes:
      - ./docker/consul/server.json:/consul/config/server.json:ro
      - consul_data:/consul/data

  traefik:
    image: traefik:v2.5
    command:
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--providers.file.filename=/root/mlmodelscope-www.yml"
      - "--entrypoints.web.address=:80"

    depends_on:
      api:
        condition: service_healthy
      companion:
        condition: service_started
      trace:
        condition: service_started

    ports:
      - "80:80"
      - "8080:8080"

    networks:
      - traefik

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./docker/mlmodelscope-www.yml:/root/mlmodelscope-www.yml

  trace:
    networks:
      - default
      - traefik

networks:
  traefik:
    name: traefik
    attachable: true

volumes:
  consul_data:
